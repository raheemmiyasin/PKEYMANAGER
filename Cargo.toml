[package]
name = "pkeymanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI for managing SSH public keys on macOS"
license = "MIT"

[dependencies]
# ratatui draws the UI; it re-exports crossterm (terminal backend) as `ratatui::crossterm`,
# so both always stay on compatible versions.
ratatui = "0.30"
anyhow = "1"
sha2 = "0.11"
base64 = "0.23"

[profile.release]
strip = true
lto = "thin"
